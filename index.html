<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marquee Training — Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-wrapper">
    <div class="card" id="auth-card">
      <div class="brand">
        <div class="brand-mark">
          <div class="brand-icon">◈</div>
          <div class="brand-name">MARQUEE <span>TRAINING</span></div>
        </div>
        <div class="brand-sub">Attendance Intelligence System</div>
      </div>

      <!-- TAB TOGGLE -->
      <div style="display:flex; gap:0; margin-bottom:28px; border:1px solid var(--border2); border-radius:8px; overflow:hidden;">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">LOGIN</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">REGISTER</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="form-login">
        <div class="form-group">
          <label class="label">Email Address</label>
          <input type="email" id="login-email" placeholder="student@college.edu" />
        </div>
        <div class="form-group">
          <label class="label">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" id="login-btn" onclick="doLogin()">
          <span>⚡</span> AUTHENTICATE
        </button>
      </div>

      <!-- REGISTER FORM -->
      <div id="form-register" style="display:none;">
        <div class="form-group">
          <label class="label">Full Name</label>
          <input type="text" id="reg-name" placeholder="Your full name" />
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group">
            <label class="label">Roll Number</label>
            <input type="text" id="reg-roll" placeholder="e.g. CS21001" />
          </div>
          <div class="form-group">
            <label class="label">Role</label>
            <select id="reg-role">
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="label">Email Address</label>
          <input type="email" id="reg-email" placeholder="student@college.edu" />
        </div>
        <div class="form-group">
          <label class="label">Password</label>
          <input type="password" id="reg-password" placeholder="Min 6 characters" />
        </div>
        <button class="btn btn-primary" id="register-btn" onclick="doRegister()">
          <span>✦</span> CREATE ACCOUNT
        </button>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <style>
    /* Tab styles are in styles.css */
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    function switchTab(tab) {
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    }

    async function doLogin() {
      const btn = document.getElementById('login-btn');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) return toast('Fill all fields', 'error');

      btn.disabled = true;
      btn.textContent = 'AUTHENTICATING...';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        toast(error.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>⚡</span> AUTHENTICATE';
        return;
      }

      // Get profile to determine role
      const { data: profile } = await supabase
        .from('profiles').select('role').eq('id', data.user.id).single();

      toast('Access granted ✓', 'success');
      setTimeout(() => {
        if (profile?.role === 'teacher') {
          window.location.href = 'teacher.html';
        } else {
          window.location.href = 'student.html';
        }
      }, 800);
    }

    async function doRegister() {
      const btn = document.getElementById('register-btn');
      const name = document.getElementById('reg-name').value.trim();
      const roll = document.getElementById('reg-roll').value.trim();
      const role = document.getElementById('reg-role').value;
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      if (!name || !roll || !email || !password) return toast('Fill all fields', 'error');
      if (password.length < 6) return toast('Password min 6 characters', 'error');

      btn.disabled = true;
      btn.textContent = 'CREATING ACCOUNT...';

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        toast(error.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>✦</span> CREATE ACCOUNT';
        return;
      }

      // data.user can be null if email confirmation is required
      if (!data.user) {
        toast('Check your email to confirm your account, then login.', 'success');
        setTimeout(() => switchTab('login'), 2000);
        btn.disabled = false;
        btn.innerHTML = '<span>✦</span> CREATE ACCOUNT';
        return;
      }

      // Create profile
      const { error: profileError } = await supabase.from('profiles').insert({
        id: data.user.id,
        name,
        enrollment_number: roll,
        role,
      });

      if (profileError) {
        toast(profileError.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>✦</span> CREATE ACCOUNT';
        return;
      }

      toast('Account created! Please login.', 'success');
      setTimeout(() => switchTab('login'), 1200);
      btn.disabled = false;
      btn.innerHTML = '<span>✦</span> CREATE ACCOUNT';
    }

    // Auto redirect if already logged in
    (async () => {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        const { data: p } = await supabase.from('profiles').select('role').eq('id', user.id).single();
        if (p?.role === 'teacher') window.location.href = 'teacher.html';
        else window.location.href = 'student.html';
      }
    })();
  </script>
</body>
</html>
